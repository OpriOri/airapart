#сверху хуйня для nginx внешнего, а снизу внутренняя

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # УБРАТЬ location /api — пусть его обрабатывает внешний nginx
}
